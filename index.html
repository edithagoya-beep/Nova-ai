
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080f25;
  color: white;
}

header {
  padding: 20px;
  background: #101d40;
  text-align: center;
  border-bottom: 2px solid #168cff;
}

header h1 {
  color: #39a9ff;
  margin: 0;
  font-size: 30px;
}

header p {
  color: #b9dfff;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  padding: 35px 10px;
}

.logo {
  font-size: 65px;
}

.welcome h2 {
  color: #39a9ff;
}

button {
  background: #168cff;
  color: white;
  border: none;
  padding: 14px 22px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #0066cc;
}

#chatPage {
  display: none;
}

.chatbox {
  height: 350px;
  overflow-y: auto;
  background: #101d40;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
}

.user {
  background: #0756a3;
  text-align: right;
}

.bot {
  background: #25365e;
}

.input-area {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #168cff;
  background: #101d40;
  color: white;
  font-size: 16px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #91a6c8;
}
</style>
</head>

<body>

<header>
  <h1>✦ NOVA AI</h1>
  <p>Your world. Your intelligence.</p>
</header>

<div class="container">

  <section id="homePage" class="welcome">
    <div class="logo">🌌</div>
    <h2>WELCOME TO NOVA AI</h2>
    <p>Your futuristic AI assistant.</p>
    <p>Ask questions, learn, create and explore.</p>
    <button onclick="startChat()">START CHAT</button>
  </section>

  <section id="chatPage">
    <h2>💬 NOVA AI CHAT</h2>

    <div class="chatbox" id="chatbox">
      <div class="message bot">
        Hello! I am NOVA AI. What would you like to explore today?
      </div>
    </div>

    <div class="input-area">
      <input id="userInput" type="text"
      placeholder="Ask NOVA anything..."
      onkeydown="if(event.key==='Enter') sendMessage()">

      <button onclick="sendMessage()">Send</button>
    </div>

    <p style="text-align:center">
      <button onclick="goHome()">Home</button>
    </p>
  </section>

</div>

<footer>
  © 2026 NOVA AI | Built for everyone 🌍
</footer>

<script>
function startChat() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("chatPage").style.display = "block";
}

function goHome() {
  document.getElementById("chatPage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const chatbox = document.getElementById("chatbox");
  const message = input.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chatbox.appendChild(userMessage);

  const reply = document.createElement("div");
  reply.className = "message bot";
  reply.textContent = "I'm NOVA AI! This is the demo chat. Connect a secure AI backend to enable real AI answers.";
  chatbox.appendChild(reply);

  input.value = "";
  chatbox.scrollTop = chatbox.scrollHeight;
}
</script>

</body>
</html>
